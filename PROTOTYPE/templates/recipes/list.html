{% extends "base.html" %}
{% block title %}Recipes · Tasty Truths{% endblock %}

{% block content %}
  <h1>Recipes</h1>
  <ul>
    {% for r in recipes %}
      <li><a href="{{ url_for('recipe_detail', id_slug=r.id ~ '-' ~ r.slug) }}">{{ r.title }}</a></li>
    {% else %}
      <li>No recipes yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
