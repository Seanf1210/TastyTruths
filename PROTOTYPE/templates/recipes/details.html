{% extends "base.html" %}
{% block title %}{{ recipe.title }} · Tasty Truths{% endblock %}

{% block content %}
  <article class="recipe">
    <h1>{{ recipe.title }}</h1>
    <p class="meta">Published {{ recipe.created_at.strftime('%Y-%m-%d') }}</p>
    <div class="body">
      {{ recipe.content | safe }}
    </div>
  </article>
{% endblock %}
