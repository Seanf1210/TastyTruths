<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tasty Truths</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Short page description." />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="../styles.css" />
  </head>

  <body>
    <!-- header that can be used for all pages with small tweaks to links-->
    <header class="site-header">
      <div class="header-container container">
        <div class="logo">
          <a href="../index.html">
            <img src="../assets/images/logo_main.png" alt="Tasty Truths" />
          </a>
        </div>

        <nav class="main-nav" aria-label="Primary">
          <a href="about_us.html">About</a>
          <a href="recipes.html">Recipes</a>
          <a href="blog.html">Blog</a>
          <a href="contact.html">Contact</a>
        </nav>

        <div class="auth-links">
          <a href="login.html" class="button">Login</a>
          <a href="signup.html" class="button signup">Sign Up</a>
        </div>
      </div>
    </header>

    <div class="login-form">
      <form id="loginForm">
        <h2>Login</h2>

        <label for="email">Email:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        /><br /><br />

        <label for="password">Password:</label><br />
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
        /><br /><br />

        <button type="submit" id="loginBtn">Login</button>
        <button type="button" onclick="window.location.href='../index.html'">
          Cancel
        </button>

        <p id="loginError" style="color: crimson; margin-top: 0.5rem"></p>
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>

    <script>
      async function getCsrf() {
        const res = await fetch("/api/auth/csrf-token", {
          credentials: "same-origin",
        });
        const data = await res.json();
        return data.csrfToken;
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const btn = document.getElementById("loginBtn");
          const error = document.getElementById("loginError");
          error.textContent = "";
          btn.disabled = true;

          try {
            const csrf = await getCsrf();
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrf,
              },
              body: JSON.stringify({
                email: form.email.value.trim().toLowerCase(),
                password: form.password.value,
              }),
              credentials: "same-origin",
            });

            const data = await res.json();
            if (res.ok) {
              // Session cookie set; you’re logged in
              window.location.href = "/index.html";
            } else {
              error.textContent =
                data.error ||
                "Login failed. Please check your email and password.";
            }
          } catch (err) {
            error.textContent = "Network error. Please try again.";
          } finally {
            btn.disabled = false;
          }
        });
    </script>

    <footer class="footer">
      <div class="footerbox">
        <div class="fbox" id="fbox1">
          <a href="../index.html">
            <img src="../assets/images/logo_main.png" alt="Tasty Truths logo" />
          </a>
        </div>
        <div class="fbox" id="fbox2">
          <p class="hover-menu">Pages ↑</p>
          <div class="popup">
            <a href="../index.html">Home</a>
            <a href="/pages/recipes.html">Recipes</a>
            <a href="/pages/contact.html">Contact</a>
            <a href="/pages/blog.html">Blog</a>
          </div>
        </div>
        <div class="fbox" id="fbox3">
          <a href="mailto:support@tastytruths.com?subject=Customer%20Support"
            >Support</a
          >
        </div>
        <div class="fbox" id="fbox4">
          <a href="/pages/about_us.html">About Us</a>
        </div>
        <div class="fbox" id="fbox5">
          <a href="mailto:tastytruths@gmail.com">
            <ion-icon name="mail-outline"></ion-icon>
          </a>
          <a href="tel:+1234567890"><ion-icon name="call-outline"></ion-icon>
          </a>
          <a href="https:www.instagram.com" target="_blank">
            <ion-icon name="logo-instagram"></ion-icon>
          </a>
          <a href="https:www.facebook.com" target="_blank">
            <ion-icon name="logo-facebook"></ion-icon>
          </a>
          <a href="https:www.youtube.com" target="_blank">
            <ion-icon name="logo-youtube"></ion-icon>
          </a>
        </div>
      </div>

      <small>&copy; 2025</small>
    </footer>

    <script src="/static/js/script.js" defer></script>
  </body>
</html>
