  <body>

        <div class="auth-links">
          <a href="login.html" class="button">Login</a>
          <a href="signup.html" class="button signup">Sign Up</a>
        </div>
      </div>
    </header>

    <div class="signup-form">
      <form action="/signup" method="post">
        <h2>Create An Account!</h2>

        <label for="firstName">First Name</label><br />
        <input type="text" id="firstName" name="firstName" required /><br />

        <label for="lastName">Last Name</label><br />
        <input type="text" id="lastName" name="lastName" required /><br />

        <label for="email">Email Address</label><br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        /><br />

        <label for="username">Username</label><br />
        <input
          type="text"
          id="username"
          name="username"
          minlength="3"
          maxlength="20"
          required
        /><br />

        <label for="password">Password</label><br />
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
        /><br />

        <label for="confirmPassword">Confirm Password</label><br />
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          minlength="8"
          required
        /><br />

        <label for="dob">Date of Birth</label><br />
        <input type="date" id="dob" name="dob" required /><br />

        <label for="gender">Gender</label><br />
        <select id="gender" name="gender" required>
          <option value="">Select</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="nonbinary">Non-binary</option>
          <option value="other">Other</option>
          <option value="prefer_not_say">Prefer not to say</option></select
        ><br /><br /><br />

        <div class="terms">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms"
            >I agree to the <a href="/terms">Terms of Service</a> and
            <a href="/privacy">Privacy Policy</a>.</label
          ><br /><br />
        </div>

        <button type="submit">Sign Up</button>

        <p>Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>
    <script>
      async function getCsrf() {
        const res = await fetch("/api/auth/csrf-token");
        const data = await res.json();
        return data.csrfToken;
      }

      document
        .querySelector(".signup-form form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const form = e.target;
          const password = form.password.value;
          const confirm = form.confirmPassword.value;
          if (password !== confirm) {
            alert("Passwords do not match.");
            return;
          }

          const csrf = await getCsrf();

          // Send only what backend expects for now:
          const payload = {
            email: form.email.value.trim().toLowerCase(),
            password: password,
          };

          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrf,
            },
            body: JSON.stringify(payload),
            credentials: "same-origin",
          });

          const data = await res.json();
          if (res.ok) {
            alert("Account created! You can now log in.");
            window.location.href = "login.html";
          } else {
            alert(data.error || "Registration failed");
          }
        });
    </script>
  </body>
