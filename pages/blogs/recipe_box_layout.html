<article class="post-card">
        <div class="card-header">
            <!--This is the avatar that will be at the top left of the recipe card-->
            <img src="https://placehold.co/100x100/5E81AC/FFFFFF" alt="User Avatar" class="avatar">
            <div class="user-info">
                <span class="user-name">Alice Smith</span>
                <span class="user-id">@alicesmith &middot; 2h</span>
            </div>
        </div>

        <!--Main text of the body-->
        <div class="card-body">
            <p>
                Text Text blah blah blah
            </p>
        </div>

        <!--Media content, can be skipped if the user does not post any media-->
        <div class="card-media">
            <img src="https://placehold.co/600x300/A3BE8C/FFFFFF" alt="Blog post image">
        </div>

        <!--Have to do Description, Ingredients, and Instructions box-->

        <div class="card-actions">
            <button class="action-button action-comment" aria-label="Comment">
                <svg viewBox="0 0 24 24">
                <!--Creates the shape of the comment icon-->
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"></path></svg>
                <!--Number of comments-->
                <span class="action-count">18</span>
            </button>
            <button class="action-button action-repost" aria-label="Repost">
                <svg viewBox="0 0 24 24">
                <!--Creates the shape of the repost icon-->
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg>
                <!--Number of reposts-->
                <span class="action-count">5</span>
            </button>
            <button class="action-button action-like" aria-label="Like">
                <svg viewBox="0 0 24 24">
                <!--Creates the shape of the like icon-->
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                <!--Number of likes-->
                <span class="action-count">124</span>
            </button>
            <button class="action-button action-share" aria-label="Share">
                <svg viewBox="0 0 24 24">
                <!--Creates the shape of the share icon-->
                    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 8.81C7.5 8.31 6.79 8 6 8c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.23-.09.46-.09.7 0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3z"></path></svg>
            </button>
        </div>
    </article>
