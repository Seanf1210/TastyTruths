  <body>
    <!-- header that can be used for all pages with small tweaks to links-->

      <div class="header-container container">

        <nav class="main-nav" aria-label="Primary">

        </div>
      </div>
    </header>

  <div class="recipe-form">
      <form action="/submit-recipe" method="post">
        <h2>Recipe Submission</h2>

        <label for="recipe-title">Recipe Title:</label><br />
        <input type="text" id="recipe-title" name="recipe-title" placeholder="Delicious Dish" required /><br /><br />

        <label for="attachment">Attachment (optional):</label><br />
        <input type="file" id="attachment" name="attachment" accept="image/*,video/*" /><br /><br />

        <label for="description">Description:</label><br />
        <textarea id="description" name="description" rows="2" placeholder="Briefly describe your recipe..." required></textarea><br /><br />

        <label for="ingredients">Ingredients:</label><br />
        <textarea id="ingredients" name="ingredients" rows="4" placeholder="List your ingredients here..." required></textarea><br /><br />

        <label for="instructions">Instructions:</label><br />
        <textarea id="instructions" name="instructions" rows="4" placeholder="Describe the steps to prepare the dish..." required></textarea><br /><br />

        <button type="submit">Submit</button>
        <button type="button" onclick="window.location.href='../index.html'">Cancel</button>

        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>

  </body>
