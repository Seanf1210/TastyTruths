<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tasty Truths – Recipes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browse crowd-sourced recipes, filtered by cuisine, diet, and time."
    />

    <!-- Favicon set -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <!-- Main stylesheet (adjust path to match your project) -->
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <!-- Header rendered in JS -->
    <div id="header-root"></div>
    <script src="/static/js/header.js"></script>

    <main class="container">
      <header class="page-header">
        <h1>Recipes</h1>
        <p class="page-subtitle">
          Explore Tasty Truths recipes by cuisine, diet, and cook time.
        </p>
      </header>

      <!-- Filters -->
      <section class="filters" aria-label="Recipe filters">
        <div class="filter-row">
          <label>
            <span>Cuisine</span>
            <select name="cuisine" id="filter-cuisine">
              <option value="">Any</option>
              <option value="American">American</option>
              <option value="Mexican">Mexican</option>
              <option value="Italian">Italian</option>
              <option value="Indian">Indian</option>
              <option value="Japanese">Japanese</option>
              <option value="Korean">Korean</option>
            </select>
          </label>

          <label>
            <span>Diet</span>
            <select name="diet" id="filter-diet">
              <option value="">Any</option>
              <option value="Vegetarian">Vegetarian</option>
              <option value="Vegan">Vegan</option>
              <option value="Gluten-Free">Gluten-Free</option>
              <option value="Dairy-Free">Dairy-Free</option>
              <option value="Keto">Keto</option>
            </select>
          </label>

          <label>
            <span>Time</span>
            <select name="time" id="filter-time">
              <option value="">Any</option>
              <option value="under-20">&lt; 20 min</option>
              <option value="20-45">20–45 min</option>
              <option value="over-45">&gt; 45 min</option>
            </select>
          </label>

          <button class="apply-filters" type="button" id="apply-filters">
            Apply
          </button>
          <button class="clear-filters" type="button" id="clear-filters">
            Clear
          </button>
        </div>
      </section>

      <!-- Recipe grid: populated via JS -->
      <section class="recipe-grid" aria-label="Recipes">
        <p class="empty-state" hidden>No recipes found. Try adjusting filters.</p>
        <!-- JS will inject <article class="recipe-card"> items here -->
      </section>

      <!-- Pagination (JS can wire this up later) -->
      <nav class="pagination" aria-label="Pagination">
        <button class="page-prev" type="button" disabled>Prev</button>
        <ol class="page-list">
          <li>
            <button class="is-active" type="button" aria-current="page">
              1
            </button>
          </li>
          <!-- Future pages can be injected via JS -->
        </ol>
        <button class="page-next" type="button" disabled>Next</button>
      </nav>
    </main>

    <!-- Footer rendered in JS -->
    <div id="footer-root"></div>
    <script src="/static/js/footer.js"></script>

    <!-- Recipe card template used by JS -->
    <template id="recipe-card-template">
      <article class="recipe-card">
        <a class="card-link" href="#">
          <figure class="card-media">
            <img src="" alt="" loading="lazy" />
          </figure>
          <div class="card-body">
            <h2 class="card-title"></h2>
            <p class="card-excerpt"></p>
            <dl class="meta">
              <div>
                <dt>Time</dt>
                <dd><time datetime=""></time></dd>
              </div>
              <div>
                <dt>Serves</dt>
                <dd></dd>
              </div>
              <div>
                <dt>Level</dt>
                <dd></dd>
              </div>
            </dl>
            <ul class="tags" aria-label="Tags"></ul>
          </div>
        </a>
        <div class="card-footer">
          <div class="rating" aria-label="">
            <span class="rating-stars">★★★★☆</span>
            <span class="rating-count"></span>
          </div>
          <button
            class="save-button"
            type="button"
            aria-pressed="false"
            aria-label="Save recipe"
          >
            Save
          </button>
        </div>
      </article>
    </template>

    <!-- Page JS: uses store.js to render recipes -->
    <script type="module" src="/static/js/recipes-page.js"></script>
  </body>
</html>
